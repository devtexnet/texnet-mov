<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial - Assinatura de Contrato Texnet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100dvh;
      object-fit: contain;
      outline: none;
      background-color: #000; /* Evita fundo transparente fantasma */
    }

    #unmute-overlay {
      position: absolute;
      top: 24px;
      background-color: rgba(0, 86, 210, 0.9);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 10;
      user-select: none;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div id="unmute-overlay">🔊 Toque para ativar o som</div>

  <!-- Adicionados atributos de compatibilidade para evitar tela preta em celulares -->
  <video id="meuVideo" autoplay playsinline webkit-playsinline x5-playsinline controls preload="auto">
    <source src="video.mp4" type="video/mp4">
    Seu navegador não suporta a reprodução deste vídeo.
  </video>

  <script>
    const video = document.getElementById('meuVideo');
    const overlay = document.getElementById('unmute-overlay');

    window.addEventListener('load', () => {
      video.play().catch(() => {
        video.muted = true;
        video.play();
        overlay.style.display = 'flex';
      });
    });

    function ativarSom() {
      if (video.muted) {
        video.muted = false;
        video.currentTime = 0;
        video.play();
        overlay.style.display = 'none';
      }
    }

    overlay.addEventListener('click', ativarSom);
    document.body.addEventListener('click', ativarSom, { once: true });
  </script>

</body>
</html>
