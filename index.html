<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texnet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100dvh;
      object-fit: contain;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Renomeie o arquivo do seu vídeo para "video.mp4" ou altere o src abaixo -->
  <video controls playsinline preload="metadata">
    <source src="video.mp4" type="video/mp4">
    Seu navegador não suporta a reprodução deste vídeo.
  </video>

</body>
</html>
